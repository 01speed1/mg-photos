[package]
name = "mg-photos"
version = "0.1.0"
edition = "2024"

[dependencies]
tiny_http = "0.12"
minreq = { version = "2.11", features = [
  "https-rustls",
] } # Trae sus propios certificados
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.0"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
